name: CI

on:
  # every pushed branch, not only main: a secret on a feature branch is already on
  # GitHub before any PR exists (PR #2 review round 2, finding 4)
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Secret scan (names + credential-shaped content, SPEC V.12)
        run: python3 scripts/check_secrets.py --all
      # A branch can edit its own scanner; also run main's copy so it can't weaken
      # the scan for itself (PR #2 review round 2, finding 2). Skipped until main has one.
      - name: Secret scan with main's scanner
        run: |
          git fetch --depth=1 origin main
          if git show FETCH_HEAD:scripts/check_secrets.py > "$RUNNER_TEMP/check_secrets_main.py"; then
            python3 -I "$RUNNER_TEMP/check_secrets_main.py" --all
          else
            echo "main has no scripts/check_secrets.py yet; branch scan above is the only one"
          fi
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
