[project]
name = "vd98"
version = "0.1.0"
description = "Retro Windows 98-style desktop video downloader powered by yt-dlp"
authors = [
    { name = "Meduty", email = "merlin@duty-knez.at" }
]
requires-python = ">=3.12"
dependencies = [
    "pywebview[qt]>=6.2.1",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
vd98 = "vd98:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
